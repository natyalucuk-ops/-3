<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punya Jyo, jangan diambil😡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { min-height: 100vh; background: #0a0808; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .game-wrapper { background: #0f0c0a; padding: 18px; border-radius: 28px; border: 1px solid #3a2a1a; box-shadow: 0 0 60px rgba(200,80,30,0.25); }
        #gameCanvas { display: block; width: 900px; height: 600px; border-radius: 18px; cursor: none; background: #1a100c; }
        .ui-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 0 8px; color: #c0a898; font-weight: bold; font-size: 17px; flex-wrap: wrap; gap: 8px; }
        .ui-box { background: rgba(10,6,4,0.85); padding: 6px 22px; border-radius: 40px; border: 1px solid #3a2a1a; }
        .ui-box span { color: #e0c8b0; }
        #scoreDisplay { color: #f0d8b0; font-size: 24px; margin-left: 8px; }
        #healthDisplay { color: #ff6a4a; font-size: 24px; margin-left: 8px; }
        #levelDisplay { color: #b0d0ff; font-size: 20px; margin-left: 8px; }
        .restart-btn { background: #1f100a; border: 1px solid #4a2a1a; color: #d0b8a0; padding: 6px 24px; border-radius: 40px; font-family: 'Courier New', monospace; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.25s; }
        .restart-btn:hover { background: #2f1810; color: #ffe0c0; border-color: #8a3a2a; box-shadow: 0 0 35px rgba(200,50,20,0.5); transform: scale(1.03); }
        @media (max-width: 960px) { .game-wrapper { padding: 10px; } #gameCanvas { width: 100%; height: auto; aspect-ratio: 900/600; } .ui-bar { font-size: 13px; justify-content: center; } }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="ui-bar">
        <div class="ui-box">★ SCORE <span id="scoreDisplay">0</span></div>
        <div class="ui-box">❯❯❯ LEVEL <span id="levelDisplay">1</span></div>
        <div class="ui-box">⛨ HEALTH <span id="healthDisplay">5</span></div>
        <button class="restart-btn" id="restartBtn">↻ RESPAWN</button>
    </div>
</div>

<script>
    // ============================================================
    //  NIGHT SHOOTER — 2 Crosshair + Hold to Shoot
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 600;
    const scoreSpan = document.getElementById('scoreDisplay');
    const healthSpan = document.getElementById('healthDisplay');
    const levelSpan = document.getElementById('levelDisplay');

    // ---- STATE ----
    let score = 0, health = 5, level = 1, gameOver = false;
    let spawnCounter = 0, screenShake = 0, frame = 0;
    const player = { x: 450, y: 550, radius: 12 };
    let enemies = [], particles = [], bullets = [];

    // ---- HOLD TO SHOOT ----
    let isShooting = false;
    let shootTimer = 0;
    const SHOOT_DELAY = 6; // frame antara tembakan

    // ---- PARAMETER SANTAI ----
    function getSpawnDelay() {
        return Math.max(8, 28 - level * 1.2);
    }
    function getEnemySpeed() {
        return Math.min(4.0, 1.0 + level * 0.2);
    }
    function getMaxEnemies() {
        return Math.min(25, 6 + level * 2);
    }
    function getBulletSpeed() {
        return Math.min(18, 12 + level * 0.4);
    }
    function getSpawnExtraChance() {
        return Math.min(0.4, 0.08 + level * 0.025);
    }

    // ---- BACKGROUND ----
    const buildings = [
        [10,55,280],[70,40,340],[115,60,210],[180,45,380],[230,55,260],
        [290,40,400],[335,65,190],[405,50,350],[460,40,420],[505,55,280],
        [565,45,370],[615,60,200],[680,50,390],[735,40,310],[780,55,440],[840,45,250]
    ];
    const windowData = buildings.map(([x,w,h]) => {
        const wins = [];
        for (let r = 0; r < Math.floor(h/28); r++) {
            for (let c = 0; c < Math.floor(w/18); c++) {
                if (Math.random() > 0.4) {
                    wins.push({ x: x + 4 + c*18, y: H - h + 8 + r*28 });
                }
            }
        }
        return wins;
    });

    function drawBackground() {
        const grad = ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0,'#0b0a12'); grad.addColorStop(0.5,'#181420'); grad.addColorStop(1,'#0f0c10');
        ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

        ctx.fillStyle = '#4a4a5a'; ctx.globalAlpha = 0.2;
        for (let i=0; i<40; i++) {
            ctx.beginPath();
            ctx.arc(15 + i*23 + Math.sin(i)*5, 8 + i*7 + Math.cos(i*0.5)*4, 0.8, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (let idx=0; idx<buildings.length; idx++) {
            const [x,w,h] = buildings[idx];
            ctx.fillStyle = '#1a1418';
            ctx.shadowBlur = 20; ctx.shadowColor = '#0a0808';
            ctx.fillRect(x, H-h, w, h);
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,200,150,0.25)';
            for (const win of windowData[idx]) {
                ctx.fillRect(win.x, win.y, 8, 12);
            }
        }

        ctx.font = 'bold 20px monospace';
        ctx.fillStyle = '#5a4a3a'; ctx.globalAlpha = 0.5;
        ctx.fillText('42NDST.', 780, 40);
        ctx.font = '11px monospace';
        ctx.fillText('@gbergphoto', 820, 58);
        ctx.globalAlpha = 1;

        ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 15]);
        ctx.beginPath();
        ctx.moveTo(0, 30);
        ctx.lineTo(W, 30);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
        ctx.fillRect(0, 0, W, 30);
        ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Innalillahi', 450, 22);
        ctx.textAlign = 'left';

        ctx.fillStyle = 'rgba(255, 200, 150, 0.2)';
        ctx.font = '12px monospace';
        ctx.fillText(`⚡ ${Math.round(getEnemySpeed()*10)/10}`, 20, 580);
        ctx.fillText(`👻 ${enemies.length}/${Math.round(getMaxEnemies())}`, 120, 580);
    }

    // ---- SPAWN MUSUH ----
    function spawnEnemy() {
        if (gameOver) return;
        const maxEnemies = getMaxEnemies();
        if (enemies.length >= maxEnemies) return;

        const x = 30 + Math.random() * (W - 60);
        const y = H + 20 + Math.random() * 30;

        const speed = getEnemySpeed() * (0.85 + Math.random() * 0.3);
        const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.5;

        enemies.push({
            x, y,
            vx: Math.cos(angle) * speed * 0.35,
            vy: Math.sin(angle) * speed,
            radius: 16 + Math.random() * 10,
            phase: Math.random() * Math.PI * 2,
            floatAmp: 0.2 + Math.random() * 0.3,
            floatSpeed: 1.5 + Math.random() * 1.5,
            alpha: 0.5 + Math.random() * 0.4,
            wiggle: (Math.random() - 0.5) * 0.3,
        });
    }

    // ---- TEMBAK (HOLD) ----
    function shoot() {
        if (gameOver) return;
        const mx = player.x, my = player.y;
        screenShake = 2;

        for (let i=0; i<6; i++) {
            const a = Math.random()*2*Math.PI;
            const d = 3 + Math.random()*10;
            particles.push({
                x: mx, y: my,
                vx: Math.cos(a)*d*0.4,
                vy: Math.sin(a)*d*0.4 - 0.5,
                life: 0.8,
                decay: 0.04 + Math.random()*0.03,
                radius: 2 + Math.random()*3,
                color: `hsl(35, 95%, 70%)`,
            });
        }

        const bulletSpeed = getBulletSpeed();
        bullets.push({
            x: mx,
            y: my - 10,
            vy: -bulletSpeed,
            radius: 5,
            life: 1,
        });

        for (let i=enemies.length-1; i>=0; i--) {
            const e = enemies[i];
            const dist = Math.hypot(mx - e.x, my - e.y);
            if (dist < e.radius * 0.6 + 12) {
                for (let j=0; j<15; j++) {
                    const a = Math.random()*2*Math.PI;
                    const s = 2 + Math.random()*5;
                    particles.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(a)*s,
                        vy: Math.sin(a)*s - 0.5,
                        life: 1,
                        decay: 0.02 + Math.random()*0.025,
                        radius: 3 + Math.random()*6,
                        color: `hsla(200, 80%, 70%, 0.7)`,
                    });
                }
                enemies.splice(i,1);
                score++;
                const newLevel = Math.floor(score/8) + 1;
                if (newLevel > level) {
                    level = newLevel;
                }
                updateUI();
                break;
            }
        }
    }

    function updateUI() {
        scoreSpan.textContent = score;
        healthSpan.textContent = health;
        levelSpan.textContent = level;
    }

    function restartGame() {
        score=0; health=5; level=1; gameOver=false;
        enemies=[]; particles=[]; bullets=[];
        player.x=450; player.y=550; screenShake=0;
        isShooting = false;
        shootTimer = 0;
        updateUI();
    }

    // ---- UPDATE ----
    function update() {
        frame++;
        if (gameOver) return;

        // ---- HOLD TO SHOOT ----
        if (isShooting) {
            shootTimer++;
            if (shootTimer >= SHOOT_DELAY) {
                shootTimer = 0;
                shoot();
            }
        } else {
            shootTimer = 0;
        }

        const spawnDelay = getSpawnDelay();
        const extraChance = getSpawnExtraChance();

        spawnCounter++;
        if (spawnCounter >= spawnDelay) {
            spawnCounter = 0;
            spawnEnemy();
            if (Math.random() < extraChance) spawnEnemy();
            if (level > 3 && Math.random() < extraChance * 0.7) spawnEnemy();
            if (level > 7 && Math.random() < extraChance * 0.5) spawnEnemy();
        }

        // ---- GERAKKAN MUSUH ----
        for (let i=enemies.length-1; i>=0; i--) {
            const e = enemies[i];
            
            e.x += e.vx + Math.sin(frame * 0.05 + e.phase) * e.wiggle * 0.8;
            e.y += e.vy;
            e.x += Math.sin(frame * 0.03 * e.floatSpeed + e.phase) * e.floatAmp * 0.2;

            if (e.y <= 30) {
                health--;
                updateUI();
                screenShake = 5;
                for (let j=0; j<15; j++) {
                    const a = Math.random()*2*Math.PI;
                    const s = 2 + Math.random()*5;
                    particles.push({
                        x: e.x, y: 15,
                        vx: Math.cos(a)*s,
                        vy: Math.sin(a)*s * 0.5,
                        life: 1,
                        decay: 0.02 + Math.random()*0.025,
                        radius: 3 + Math.random()*6,
                        color: `hsla(0, 90%, 50%, 0.8)`,
                    });
                }
                enemies.splice(i, 1);
                if (health <= 0) {
                    health = 0;
                    gameOver = true;
                    screenShake = 3;
                    updateUI();
                }
                continue;
            }

            if (e.x < -80 || e.x > W + 80) {
                e.x = 30 + Math.random() * (W - 60);
                e.y = H + 20 + Math.random() * 30;
                const speed = getEnemySpeed() * (0.85 + Math.random() * 0.25);
                const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.4;
                e.vx = Math.cos(angle) * speed * 0.35;
                e.vy = Math.sin(angle) * speed;
            }
        }

        // ---- BULLET ----
        for (let i=bullets.length-1; i>=0; i--) {
            const b = bullets[i];
            b.y += b.vy;
            b.life -= 0.025;
            if (b.y < -20 || b.life <= 0) {
                bullets.splice(i, 1);
            }
        }

        // ---- PARTIKEL ----
        for (let i=particles.length-1; i>=0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05;
            p.vx *= 0.97;
            p.vy *= 0.97;
            p.life -= p.decay;
            if (p.life <= 0) particles.splice(i, 1);
        }
        if (particles.length > 300) particles.splice(0, particles.length - 300);

        if (screenShake > 0) screenShake *= 0.92;
        if (screenShake < 0.1) screenShake = 0;
    }

    // ---- DRAW ----
    function draw() {
        ctx.save();
        if (screenShake > 0.3) {
            const intensity = screenShake * 0.6;
            ctx.translate(
                (Math.random() - 0.5) * intensity,
                (Math.random() - 0.5) * intensity
            );
        }

        drawBackground();

        // Bullet
        for (const b of bullets) {
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ffaa44';
            ctx.fillStyle = '#ffdd77';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius * b.life, 0, Math.PI*2);
            ctx.fill();
            const grad = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, 18);
            grad.addColorStop(0, 'rgba(255, 220, 100, 0.15)');
            grad.addColorStop(1, 'rgba(255, 220, 100, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Partikel
        for (const p of particles) {
            ctx.globalAlpha = p.life * 0.9;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff6633';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI*2);
            ctx.fillStyle = p.color || '#cc5533';
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        // Musuh
        for (const e of enemies) {
            const r = e.radius;
            const grad = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, r*1.6);
            grad.addColorStop(0, `hsla(210, 70%, 70%, ${e.alpha*0.3})`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(e.x, e.y, r*1.6, 0, Math.PI*2);
            ctx.fill();

            ctx.shadowBlur = 25;
            ctx.shadowColor = 'rgba(100,150,255,0.4)';
            ctx.fillStyle = `hsla(210, 70%, 70%, ${e.alpha*0.5})`;
            ctx.beginPath();
            ctx.arc(e.x, e.y, r, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = `hsla(210, 70%, 70%, ${e.alpha*0.35})`;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(e.x - r*0.4, e.y - r*0.3);
            for (let t=0; t<=1; t+=0.05) {
                const waveX = e.x + Math.sin(t*8 + frame*0.04 + e.phase) * r*0.25;
                const waveY = e.y - r*0.3 - t*r*0.5;
                ctx.lineTo(waveX, waveY);
            }
            ctx.lineTo(e.x + r*0.4, e.y - r*0.3);
            ctx.closePath();
            ctx.fill();

            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff3333';
            ctx.fillStyle = '#ff1a1a';
            ctx.beginPath();
            ctx.arc(e.x - r*0.3, e.y - r*0.1, r*0.16, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(e.x + r*0.3, e.y - r*0.1, r*0.16, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // ============================================================
        //  2 CROSSHAIR (Shoot Pointer)
        // ============================================================
        const px = player.x, py = player.y;

        // ---- CROSSHAIR 1 (Luar) ----
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff4400';
        ctx.strokeStyle = 'rgba(255, 200, 150, 0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, player.radius + 8, 0, Math.PI * 2);
        ctx.stroke();

        // ---- CROSSHAIR 2 (Dalam) ----
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ff2200';
        ctx.strokeStyle = 'rgba(255, 100, 80, 0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, player.radius + 2, 0, Math.PI * 2);
        ctx.stroke();

        // ---- GARIS SILANG (untuk kedua crosshair) ----
        ctx.shadowBlur = 12;
        ctx.strokeStyle = 'rgba(255, 200, 150, 0.7)';
        ctx.lineWidth = 2;
        const s = 16;
        ctx.beginPath();
        ctx.moveTo(px - s, py);
        ctx.lineTo(px + s, py);
        ctx.moveTo(px, py - s);
        ctx.lineTo(px, py + s);
        ctx.stroke();

        // ---- GARIS SILANG KEDUA (lebih pendek) ----
        ctx.strokeStyle = 'rgba(255, 100, 80, 0.5)';
        ctx.lineWidth = 1.5;
        const s2 = 10;
        ctx.beginPath();
        ctx.moveTo(px - s2, py);
        ctx.lineTo(px + s2, py);
        ctx.moveTo(px, py - s2);
        ctx.lineTo(px, py + s2);
        ctx.stroke();

        // ---- TITIK TENGAH MERAH ----
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#ff2200';
        ctx.fillStyle = '#ff3333';
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fill();

        // ---- TITIK TENGAH PUTIH (di dalam merah) ----
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;

        // ---- INDIKATOR HOLD SHOOT ----
        if (isShooting && !gameOver) {
            ctx.fillStyle = 'rgba(255, 200, 100, 0.25)';
            ctx.font = '14px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('🔫 NAIS MANN', 450, 580);
            ctx.textAlign = 'left';
        }

        // ---- GAME OVER ----
        if (gameOver) {
            ctx.fillStyle = 'rgba(8,0,0,0.78)';
            ctx.fillRect(0,0,W,H);
            ctx.font = 'bold 60px monospace';
            ctx.fillStyle = '#cc2222';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 70;
            ctx.textAlign = 'center';
            ctx.fillText('😹 MAMPOSS CUPU 😹', 450, 250);
            ctx.font = '24px monospace';
            ctx.fillStyle = '#dd9988';
            ctx.shadowBlur = 25;
            ctx.fillText('klik "RESPAWN" kalo mau idup lagi, ea😏', 450, 340);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
        }

        ctx.restore();
    }

    // ---- LOOP ----
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---- EVENTS ----
    // Mouse: HOLD untuk tembak
    canvas.addEventListener('mousedown', (e) => {
        if (gameOver) return;
        isShooting = true;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width;
        const scaleY = H/rect.height;
        let mx = (e.clientX - rect.left)*scaleX;
        let my = (e.clientY - rect.top)*scaleY;
        mx = Math.min(W, Math.max(0, mx));
        my = Math.min(H, Math.max(0, my));
        player.x = mx;
        player.y = my;
        shootTimer = SHOOT_DELAY;
    });
    canvas.addEventListener('mouseup', () => { isShooting = false; });
    canvas.addEventListener('mouseleave', () => { isShooting = false; });

    canvas.addEventListener('mousemove', (e) => {
        if (gameOver) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width;
        const scaleY = H/rect.height;
        let mx = (e.clientX - rect.left)*scaleX;
        let my = (e.clientY - rect.top)*scaleY;
        mx = Math.min(W, Math.max(0, mx));
        my = Math.min(H, Math.max(0, my));
        player.x = mx;
        player.y = my;
    });

    // Touch: HOLD untuk tembak
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameOver) return;
        isShooting = true;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width;
        const scaleY = H/rect.height;
        const t = e.touches[0];
        let mx = (t.clientX - rect.left)*scaleX;
        let my = (t.clientY - rect.top)*scaleY;
        mx = Math.min(W, Math.max(0, mx));
        my = Math.min(H, Math.max(0, my));
        player.x = mx;
        player.y = my;
        shootTimer = SHOOT_DELAY;
    });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); isShooting = false; });
    canvas.addEventListener('touchcancel', (e) => { e.preventDefault(); isShooting = false; });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (gameOver) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width;
        const scaleY = H/rect.height;
        const t = e.touches[0];
        let mx = (t.clientX - rect.left)*scaleX;
        let my = (t.clientY - rect.top)*scaleY;
        mx = Math.min(W, Math.max(0, mx));
        my = Math.min(H, Math.max(0, my));
        player.x = mx;
        player.y = my;
    }, { passive: false });

    document.getElementById('restartBtn').addEventListener('click', restartGame);

    // ---- START ----
    restartGame();
    gameLoop();
    console.log('👻 NIGHT SHOOTER || 2 Crosshair + Hold to Shoot || 👻');
    console.log('✅ Tahan klik/tap untuk tembak');
    console.log('✅ 2 lingkaran crosshair');
</script>
</body>
</html>
