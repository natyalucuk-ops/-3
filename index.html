<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punya Jyo, jangan diambil😡|| ampun puh, masi pemula🥹</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { min-height: 100vh; background: #0a0808; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; }
        .game-wrapper { background: #0f0c0a; padding: 18px; border-radius: 28px; border: 1px solid #3a2a1a; box-shadow: 0 0 60px rgba(200,80,30,0.25); position: relative; }
        #gameCanvas { display: block; width: 900px; height: 600px; border-radius: 18px; cursor: none; background: #1a100c; }
        .ui-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 0 8px; color: #c0a898; font-weight: bold; font-size: 17px; flex-wrap: wrap; gap: 8px; }
        .ui-box { background: rgba(10,6,4,0.85); padding: 6px 22px; border-radius: 40px; border: 1px solid #3a2a1a; }
        .ui-box span { color: #e0c8b0; }
        #scoreDisplay { color: #f0d8b0; font-size: 24px; margin-left: 8px; }
        #highscoreDisplay { color: #ffd700; font-size: 24px; margin-left: 8px; }
        #healthDisplay { color: #ff6a4a; font-size: 24px; margin-left: 8px; }
        #levelDisplay { color: #b0d0ff; font-size: 20px; margin-left: 8px; }
        #bombDisplay { color: #ff8844; font-size: 22px; margin-left: 8px; font-weight: bold; }
        .restart-btn { background: #1f100a; border: 1px solid #4a2a1a; color: #d0b8a0; padding: 6px 24px; border-radius: 40px; font-family: 'Courier New', monospace; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.25s; }
        .restart-btn:hover { background: #2f1810; color: #ffe0c0; border-color: #8a3a2a; box-shadow: 0 0 35px rgba(200,50,20,0.5); transform: scale(1.03); }
        .bomb-btn { background: #4a1a0a; border: 2px solid #ff6633; color: #ff8844; padding: 6px 20px; border-radius: 40px; font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.25s; animation: pulse 1s infinite; }
        .bomb-btn:hover { background: #6a2a1a; color: #ffaa66; border-color: #ff8844; transform: scale(1.05); }
        .bomb-btn:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
        .freeze-btn { background: #0a1a2a; border: 2px solid #44aaff; color: #66ccff; padding: 6px 20px; border-radius: 40px; font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.25s; min-width: 110px; }
        .freeze-btn:hover { background: #1a2a3a; color: #88ddff; border-color: #66ccff; transform: scale(1.05); }
        .freeze-btn:disabled { opacity: 0.4; cursor: not-allowed; animation: none; }
        .freeze-btn.ready { animation: freezePulse 1s infinite; }
        .freeze-btn.cooldown { background: #1a1010; border-color: #4a3a3a; color: #665544; animation: none; }
        .freeze-btn.active { background: #0a2a3a; border-color: #66ccff; color: #88ddff; animation: none; }
        .bomb-btn.hidden, .freeze-btn.hidden { display: none; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 10px rgba(255, 100, 0, 0.3); } 50% { box-shadow: 0 0 30px rgba(255, 100, 0, 0.6); } }
        @keyframes freezePulse { 0%, 100% { box-shadow: 0 0 10px rgba(100, 200, 255, 0.3); } 50% { box-shadow: 0 0 30px rgba(100, 200, 255, 0.6); } }

        /* ---- TOMBOL START ---- */
        #startOverlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(4px);
            transition: opacity 0.5s ease;
        }
        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #startOverlay h1 {
            font-size: 48px;
            color: #ff8844;
            text-shadow: 0 0 40px rgba(255, 100, 0, 0.4);
            margin-bottom: 10px;
        }
        #startOverlay p {
            font-size: 18px;
            color: #aa8877;
            margin-bottom: 30px;
        }
        #startOverlay .highscore-start {
            font-size: 22px;
            color: #ffd700;
            margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }
        #startBtn {
            background: #4a1a0a;
            border: 2px solid #ff6633;
            color: #ff8844;
            padding: 16px 50px;
            border-radius: 50px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 40px rgba(255, 100, 0, 0.2);
        }
        #startBtn:hover {
            background: #6a2a1a;
            color: #ffaa66;
            border-color: #ff8844;
            transform: scale(1.08);
            box-shadow: 0 0 60px rgba(255, 100, 0, 0.4);
        }

        @media (max-width: 960px) {
            .game-wrapper { padding: 10px; }
            #gameCanvas { width: 100%; height: auto; aspect-ratio: 900/600; }
            .ui-bar { font-size: 13px; justify-content: center; }
            .freeze-btn { min-width: 80px; font-size: 13px; padding: 4px 14px; }
            #startOverlay h1 { font-size: 32px; }
            #startBtn { font-size: 20px; padding: 12px 30px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper">
    <!-- OVERLAY START -->
    <div id="startOverlay">
        <h1>👻 NIGHT SHOOTER 👻</h1>
        <p>Punya Jyo, jangan diambil 😡</p>
        <div class="highscore-start">♕ HIGHSCORE: <span id="highscoreStartDisplay">0</span></div>
        <button id="startBtn">▶ GASS</button>
    </div>

    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div class="ui-bar">
        <div class="ui-box">★ SCORE <span id="scoreDisplay">0</span></div>
        <div class="ui-box">♕ HIGHSCORE <span id="highscoreDisplay">0</span></div>
        <div class="ui-box">❯❯❯ LEVEL <span id="levelDisplay">1</span></div>
        <div class="ui-box">⛨ HEALTH <span id="healthDisplay">7</span></div>
        <div class="ui-box">☣︎ BOM <span id="bombDisplay">0</span></div>
        <button class="bomb-btn hidden" id="bombBtn">☣︎ LEDAKIN</button>
        <button class="freeze-btn hidden" id="freezeBtn">❆ FREEZE</button>
        <button class="restart-btn" id="restartBtn">↻ RESPAWN</button>
    </div>
</div>

<script>
    // ============================================================
    //  NIGHT SHOOTER — Tombol START + Cooldown di Tombol Freeze
    // ============================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 600;
    const scoreSpan = document.getElementById('scoreDisplay');
    const highscoreSpan = document.getElementById('highscoreDisplay');
    const highscoreStartSpan = document.getElementById('highscoreStartDisplay');
    const healthSpan = document.getElementById('healthDisplay');
    const levelSpan = document.getElementById('levelDisplay');
    const bombSpan = document.getElementById('bombDisplay');
    const bombBtn = document.getElementById('bombBtn');
    const freezeBtn = document.getElementById('freezeBtn');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');

    // ---- GAME STARTED ----
    let gameStarted = false;

    // ---- HIGHSCORE ----
    let highscore = parseInt(localStorage.getItem('nightShooterHighscore')) || 0;
    highscoreSpan.textContent = highscore;
    highscoreStartSpan.textContent = highscore;

    // ---- STATE ----
    let score = 0, health = 7, level = 1, gameOver = false;
    let spawnCounter = 0, screenShake = 0, frame = 0;
    let enemies = [], particles = [], bullets = [];

    // ---- 2 POINTER ----
    const pointers = [
        { x: 400, y: 550, active: false, radius: 12 },
        { x: 500, y: 550, active: false, radius: 12 }
    ];
    let shootTimers = [0, 0];
    const SHOOT_DELAY = 6;

    // ---- BOM ----
    let bombCount = 0;
    const MAX_BOMB = 5;
    const BOMB_INTERVAL = 30;
    let nextBombScore = BOMB_INTERVAL;
    let bombActive = false;

    // ---- FREEZE ----
    let freezeActive = false;
    let freezeTimer = 0;
    const FREEZE_DURATION = 300; // 5 detik
    let freezeCooldown = 0;
    const FREEZE_COOLDOWN = 420; // 7 detik
    let freezeReady = true;

    // ---- PARAMETER ----
    function getSpawnDelay() {
        if (freezeActive) return 999;
        return Math.max(8, 28 - level * 1.2);
    }
    function getEnemySpeed() {
        return Math.min(4.0, 1.0 + level * 0.2);
    }
    function getMaxEnemies() { return Math.min(25, 6 + level * 2); }
    function getBulletSpeed() { return Math.min(18, 12 + level * 0.4); }
    function getSpawnExtraChance() { return Math.min(0.4, 0.08 + level * 0.025); }

    // ---- BACKGROUND ----
    const buildings = [
        [10,55,280],[70,40,340],[115,60,210],[180,45,380],[230,55,260],
        [290,40,400],[335,65,190],[405,50,350],[460,40,420],[505,55,280],
        [565,45,370],[615,60,200],[680,50,390],[735,40,310],[780,55,440],[840,45,250]
    ];
    const windowData = buildings.map(([x,w,h]) => {
        const wins = [];
        for (let r = 0; r < Math.floor(h/28); r++) {
            for (let c = 0; c < Math.floor(w/18); c++) {
                if (Math.random() > 0.4) {
                    wins.push({ x: x + 4 + c*18, y: H - h + 8 + r*28 });
                }
            }
        }
        return wins;
    });

    function drawBackground() {
        const grad = ctx.createLinearGradient(0,0,0,H);
        grad.addColorStop(0,'#0b0a12'); grad.addColorStop(0.5,'#181420'); grad.addColorStop(1,'#0f0c10');
        ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

        ctx.fillStyle = '#4a4a5a'; ctx.globalAlpha = 0.2;
        for (let i=0; i<40; i++) {
            ctx.beginPath();
            ctx.arc(15 + i*23 + Math.sin(i)*5, 8 + i*7 + Math.cos(i*0.5)*4, 0.8, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        for (let idx=0; idx<buildings.length; idx++) {
            const [x,w,h] = buildings[idx];
            ctx.fillStyle = '#1a1418';
            ctx.shadowBlur = 20; ctx.shadowColor = '#0a0808';
            ctx.fillRect(x, H-h, w, h);
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,200,150,0.25)';
            for (const win of windowData[idx]) {
                ctx.fillRect(win.x, win.y, 8, 12);
            }
        }

        ctx.font = 'bold 20px monospace';
        ctx.fillStyle = '#5a4a3a'; ctx.globalAlpha = 0.5;
        ctx.fillText('42NDST.', 780, 40);
        ctx.font = '11px monospace';
        ctx.fillText('@gbergphoto', 820, 58);
        ctx.globalAlpha = 1;

        ctx.strokeStyle = 'rgba(255, 50, 50, 0.4)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 15]);
        ctx.beginPath();
        ctx.moveTo(0, 30);
        ctx.lineTo(W, 30);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
        ctx.fillRect(0, 0, W, 30);
        ctx.fillStyle = 'rgba(255, 50, 50, 0.5)';
        ctx.font = '14px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Innalillahi', 450, 22);
        ctx.textAlign = 'left';

        ctx.fillStyle = 'rgba(255, 200, 150, 0.2)';
        ctx.font = '12px monospace';
        ctx.fillText(`⚡︎ ${Math.round(getEnemySpeed()*10)/10}`, 20, 580);
        ctx.fillText(`☠︎︎ ${enemies.length}/${Math.round(getMaxEnemies())}`, 120, 580);
        ctx.fillText(`☣︎ ${bombCount}`, 220, 580);

        if (bombActive) {
            ctx.fillStyle = 'rgba(255, 100, 0, 0.08)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.font = 'bold 36px monospace';
            ctx.fillStyle = '#ff8833';
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#ff4400';
            ctx.fillText('☣︎ BOM AKTIF! Poin x2!', 450, 150);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
        }

        if (freezeActive) {
            ctx.fillStyle = 'rgba(100, 200, 255, 0.08)';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.font = 'bold 36px monospace';
            ctx.fillStyle = '#66ccff';
            ctx.shadowBlur = 40;
            ctx.shadowColor = '#0088ff';
            ctx.fillText('❆ BEKUUU!', 450, 200);
            for (let i=0; i<12; i++) {
                const angle = i/12 * Math.PI*2 + frame*0.02;
                const dist = 120 + Math.sin(frame*0.05 + i)*25;
                ctx.shadowBlur = 30;
                ctx.fillStyle = `rgba(100, 200, 255, ${0.15 + Math.sin(frame*0.03 + i)*0.1})`;
                ctx.beginPath();
                ctx.arc(450 + Math.cos(angle)*dist, 300 + Math.sin(angle)*dist, 12 + Math.sin(frame*0.06 + i)*5, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
        }
    }

    // ---- SPAWN ----
    function spawnEnemy() {
        if (gameOver || freezeActive || !gameStarted) return;
        const maxEnemies = getMaxEnemies();
        if (enemies.length >= maxEnemies) return;
        const x = 30 + Math.random() * (W - 60);
        const y = H + 20 + Math.random() * 30;
        const speed = getEnemySpeed() * (0.85 + Math.random() * 0.3);
        const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.5;
        enemies.push({
            x, y,
            vx: Math.cos(angle) * speed * 0.35,
            vy: Math.sin(angle) * speed,
            radius: 16 + Math.random() * 10,
            phase: Math.random() * Math.PI * 2,
            floatAmp: 0.2 + Math.random() * 0.3,
            floatSpeed: 1.5 + Math.random() * 1.5,
            alpha: 0.5 + Math.random() * 0.4,
            wiggle: (Math.random() - 0.5) * 0.3,
        });
    }

    // ---- TEMBAK ----
    function shootFromPointer(index) {
        if (gameOver || !gameStarted) return;
        const p = pointers[index];
        if (!p.active) return;
        const mx = p.x, my = p.y;
        screenShake = 2;
        for (let i=0; i<4; i++) {
            const a = Math.random()*2*Math.PI;
            const d = 2 + Math.random()*8;
            particles.push({
                x: mx, y: my,
                vx: Math.cos(a)*d*0.3,
                vy: Math.sin(a)*d*0.3 - 0.4,
                life: 0.7,
                decay: 0.05 + Math.random()*0.03,
                radius: 2 + Math.random()*3,
                color: `hsl(35, 95%, 70%)`,
            });
        }
        const bulletSpeed = getBulletSpeed();
        bullets.push({
            x: mx,
            y: my - 10,
            vy: -bulletSpeed,
            radius: 5,
            life: 1,
        });
        for (let i=enemies.length-1; i>=0; i--) {
            const e = enemies[i];
            const dist = Math.hypot(mx - e.x, my - e.y);
            if (dist < e.radius * 0.6 + 12) {
                let pointGain = 1;
                if (bombActive) pointGain = 2;
                for (let j=0; j<12; j++) {
                    const a = Math.random()*2*Math.PI;
                    const s = 2 + Math.random()*5;
                    particles.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(a)*s,
                        vy: Math.sin(a)*s - 0.5,
                        life: 1,
                        decay: 0.02 + Math.random()*0.025,
                        radius: 3 + Math.random()*6,
                        color: `hsla(200, 80%, 70%, 0.7)`,
                    });
                }
                enemies.splice(i,1);
                score += pointGain;
                const newLevel = Math.floor(score/8) + 1;
                if (newLevel > level) level = newLevel;
                checkBombReward();
                updateUI();
                break;
            }
        }
    }

    // ---- BOM ----
    function triggerBomb() {
        if (bombCount <= 0 || gameOver || bombActive || !gameStarted) return;
        bombActive = true;
        bombCount--;
        bombBtn.disabled = true;
        screenShake = 12;
        const cx = 450, cy = 300;
        for (let j=0; j<80; j++) {
            const a = Math.random()*2*Math.PI;
            const s = 5 + Math.random()*20;
            particles.push({
                x: cx + (Math.random()-0.5)*150,
                y: cy + (Math.random()-0.5)*150,
                vx: Math.cos(a)*s,
                vy: Math.sin(a)*s - 1.5,
                life: 1.5,
                decay: 0.008 + Math.random()*0.012,
                radius: 5 + Math.random()*20,
                color: `hsla(30, 100%, ${50 + Math.random()*40}%, 0.9)`,
            });
        }
        let killed = 0;
        for (let i=enemies.length-1; i>=0; i--) {
            const e = enemies[i];
            killed++;
            for (let j=0; j<15; j++) {
                const a = Math.random()*2*Math.PI;
                const s = 2 + Math.random()*7;
                particles.push({
                    x: e.x, y: e.y,
                    vx: Math.cos(a)*s,
                    vy: Math.sin(a)*s - 0.5,
                    life: 1.2,
                    decay: 0.015 + Math.random()*0.02,
                    radius: 3 + Math.random()*10,
                    color: `hsla(30, 100%, ${50 + Math.random()*30}%, 0.9)`,
                });
            }
            score += 2;
            enemies.splice(i, 1);
        }
        if (killed > 0) {
            score += Math.floor(killed / 2);
            for (let i=0; i<8; i++) {
                particles.push({
                    x: 450 + (Math.random()-0.5)*250,
                    y: 200 + Math.random()*150,
                    vx: (Math.random()-0.5)*2,
                    vy: -1 - Math.random()*2,
                    life: 1.5,
                    decay: 0.008 + Math.random()*0.01,
                    radius: 15 + Math.random()*20,
                    color: `hsla(45, 100%, ${60 + Math.random()*30}%, 0.6)`,
                });
            }
        }
        const newLevel = Math.floor(score/8) + 1;
        if (newLevel > level) level = newLevel;
        checkBombReward();
        updateUI();
        setTimeout(() => {
            bombActive = false;
            bombBtn.disabled = (bombCount <= 0);
            updateUI();
        }, 2000);
    }

    function checkBombReward() {
        while (score >= nextBombScore && bombCount < MAX_BOMB) {
            bombCount++;
            nextBombScore += BOMB_INTERVAL;
            for (let i=0; i<20; i++) {
                const a = Math.random()*2*Math.PI;
                const s = 2 + Math.random()*5;
                particles.push({
                    x: 450 + (Math.random()-0.5)*200,
                    y: 300 + (Math.random()-0.5)*100,
                    vx: Math.cos(a)*s,
                    vy: Math.sin(a)*s - 1,
                    life: 1.2,
                    decay: 0.015 + Math.random()*0.02,
                    radius: 4 + Math.random()*8,
                    color: `hsla(30, 100%, ${60 + Math.random()*30}%, 0.8)`,
                });
            }
        }
        bombBtn.disabled = (bombCount <= 0 || bombActive);
        updateUI();
    }

    // ---- HIGHSCORE ----
    function checkHighscore() {
        if (score > highscore) {
            highscore = score;
            localStorage.setItem('nightShooterHighscore', highscore);
            highscoreSpan.textContent = highscore;
            highscoreStartSpan.textContent = highscore;
            for (let i=0; i<30; i++) {
                const a = Math.random()*2*Math.PI;
                const s = 3 + Math.random()*8;
                particles.push({
                    x: 450 + (Math.random()-0.5)*300,
                    y: 200 + Math.random()*200,
                    vx: Math.cos(a)*s,
                    vy: Math.sin(a)*s - 1,
                    life: 2,
                    decay: 0.008 + Math.random()*0.015,
                    radius: 5 + Math.random()*12,
                    color: `hsla(45, 100%, ${60 + Math.random()*30}%, 0.9)`,
                });
            }
            return true;
        }
        return false;
    }

    // ---- FREEZE ----
    function triggerFreeze() {
        if (!freezeReady || freezeActive || gameOver || !gameStarted) return;
        freezeReady = false;
        freezeActive = true;
        freezeTimer = 0;
        freezeCooldown = 0;
        freezeBtn.disabled = true;
        freezeBtn.textContent = '❆ 5s';
        freezeBtn.className = 'freeze-btn active';
        
        for (let j=0; j<60; j++) {
            const a = Math.random()*2*Math.PI;
            const s = 2 + Math.random()*10;
            particles.push({
                x: 450 + (Math.random()-0.5)*600,
                y: 200 + Math.random()*400,
                vx: Math.cos(a)*s * 0.2,
                vy: Math.sin(a)*s * 0.2 - 0.3,
                life: 2,
                decay: 0.008 + Math.random()*0.01,
                radius: 4 + Math.random()*14,
                color: `hsla(200, 80%, ${70 + Math.random()*25}%, 0.8)`,
            });
        }

        setTimeout(() => {
            freezeActive = false;
            freezeReady = false;
            freezeCooldown = 0;
            freezeBtn.disabled = true;
            freezeBtn.textContent = '⌛︎ 7s';
            freezeBtn.className = 'freeze-btn cooldown';
            updateUI();
        }, FREEZE_DURATION / 60 * 1000);
    }

    function updateUI() {
        scoreSpan.textContent = score;
        healthSpan.textContent = health;
        levelSpan.textContent = level;
        highscoreSpan.textContent = highscore;
        highscoreStartSpan.textContent = highscore;
        bombSpan.textContent = bombCount;
        
        // BOM BUTTON
        bombBtn.disabled = (bombCount <= 0 || bombActive);
        bombBtn.textContent = bombActive ? '☣︎ BOOM!' : '☣︎ LEDAKIN';
        bombBtn.style.borderColor = bombCount > 0 ? '#ff8844' : '#4a2a1a';
        bombBtn.style.color = bombCount > 0 ? '#ff8844' : '#665544';

        // FREEZE BUTTON
        if (freezeActive) {
            const remaining = Math.ceil((FREEZE_DURATION - freezeTimer) / 60);
            freezeBtn.textContent = `❆ ${remaining}s`;
            freezeBtn.className = 'freeze-btn active';
            freezeBtn.disabled = true;
        } else if (freezeReady) {
            freezeBtn.textContent = '❆ FREEZE';
            freezeBtn.className = 'freeze-btn ready';
            freezeBtn.disabled = false;
        } else {
            const remaining = Math.ceil(freezeCooldown / 60);
            freezeBtn.textContent = `⌛︎ ${remaining}s`;
            freezeBtn.className = 'freeze-btn cooldown';
            freezeBtn.disabled = true;
        }
    }

    function restartGame() {
        score=0; health=7; level=1; gameOver=false;
        enemies=[]; particles=[]; bullets=[];
        pointers[0].x = 400; pointers[0].y = 550; pointers[0].active = false;
        pointers[1].x = 500; pointers[1].y = 550; pointers[1].active = false;
        shootTimers = [0, 0];
        screenShake = 0;
        bombCount = 0;
        nextBombScore = BOMB_INTERVAL;
        bombActive = false;
        freezeActive = false;
        freezeTimer = 0;
        freezeCooldown = 0;
        freezeReady = true;
        bombBtn.disabled = true;
        freezeBtn.disabled = false;
        freezeBtn.textContent = '❆ FREEZE';
        freezeBtn.className = 'freeze-btn ready';
        updateUI();
    }

    // ---- START GAME ----
    function startGame() {
        gameStarted = true;
        startOverlay.classList.add('hidden');
        bombBtn.classList.remove('hidden');
        freezeBtn.classList.remove('hidden');
        restartGame();
        if (!window._gameLoopStarted) {
            window._gameLoopStarted = true;
            gameLoop();
        }
        console.log('ৡ AYO GASS!');
    }

    startBtn.addEventListener('click', startGame);

    // ---- UPDATE ----
    function update() {
        frame++;
        if (gameOver || !gameStarted) return;

        if (freezeActive) {
            freezeTimer++;
            if (freezeTimer % 60 === 0) updateUI();
            if (freezeTimer >= FREEZE_DURATION) {
                freezeActive = false;
                freezeReady = false;
                freezeCooldown = 0;
                updateUI();
            }
        }

        if (!freezeReady && !freezeActive) {
            freezeCooldown++;
            if (freezeCooldown >= FREEZE_COOLDOWN) {
                freezeReady = true;
                updateUI();
            } else {
                updateUI();
            }
        }

        for (let i=0; i<2; i++) {
            if (pointers[i].active) {
                shootTimers[i]++;
                if (shootTimers[i] >= SHOOT_DELAY) {
                    shootTimers[i] = 0;
                    shootFromPointer(i);
                }
            } else {
                shootTimers[i] = 0;
            }
        }

        if (!freezeActive) {
            const spawnDelay = getSpawnDelay();
            const extraChance = getSpawnExtraChance();
            spawnCounter++;
            if (spawnCounter >= spawnDelay) {
                spawnCounter = 0;
                spawnEnemy();
                if (Math.random() < extraChance) spawnEnemy();
                if (level > 3 && Math.random() < extraChance * 0.7) spawnEnemy();
                if (level > 7 && Math.random() < extraChance * 0.5) spawnEnemy();
            }
        }

        for (let i=enemies.length-1; i>=0; i--) {
            const e = enemies[i];
            
            if (!freezeActive) {
                e.x += e.vx + Math.sin(frame * 0.05 + e.phase) * e.wiggle * 0.8;
                e.y += e.vy;
                e.x += Math.sin(frame * 0.03 * e.floatSpeed + e.phase) * e.floatAmp * 0.2;
            } else {
                e.x += Math.sin(frame * 0.01 + e.phase) * 0.03;
                e.y += Math.sin(frame * 0.015 + e.phase * 1.3) * 0.03;
            }

            if (e.y <= 30) {
                health--;
                updateUI();
                screenShake = 5;
                for (let j=0; j<15; j++) {
                    const a = Math.random()*2*Math.PI;
                    const s = 2 + Math.random()*5;
                    particles.push({
                        x: e.x, y: 15,
                        vx: Math.cos(a)*s,
                        vy: Math.sin(a)*s * 0.5,
                        life: 1,
                        decay: 0.02 + Math.random()*0.025,
                        radius: 3 + Math.random()*6,
                        color: `hsla(0, 90%, 50%, 0.8)`,
                    });
                }
                enemies.splice(i, 1);
                if (health <= 0) {
                    health = 0;
                    gameOver = true;
                    screenShake = 3;
                    checkHighscore();
                    updateUI();
                }
                continue;
            }

            if (e.x < -80 || e.x > W + 80) {
                e.x = 30 + Math.random() * (W - 60);
                e.y = H + 20 + Math.random() * 30;
                const speed = getEnemySpeed() * (0.85 + Math.random() * 0.25);
                const angle = -Math.PI/2 + (Math.random() - 0.5) * 0.4;
                e.vx = Math.cos(angle) * speed * 0.35;
                e.vy = Math.sin(angle) * speed;
            }
        }

        for (let i=bullets.length-1; i>=0; i--) {
            const b = bullets[i];
            b.y += b.vy;
            b.life -= 0.025;
            if (b.y < -20 || b.life <= 0) bullets.splice(i, 1);
        }

        for (let i=particles.length-1; i>=0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05;
            p.vx *= 0.97;
            p.vy *= 0.97;
            p.life -= p.decay;
            if (p.life <= 0) particles.splice(i, 1);
        }
        if (particles.length > 400) particles.splice(0, particles.length - 400);

        if (screenShake > 0) screenShake *= 0.92;
        if (screenShake < 0.1) screenShake = 0;
    }

    // ---- DRAW ----
    function draw() {
        ctx.save();
        if (screenShake > 0.3) {
            const intensity = screenShake * 0.6;
            ctx.translate((Math.random()-0.5)*intensity, (Math.random()-0.5)*intensity);
        }
        drawBackground();

        for (const b of bullets) {
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#ffaa44';
            ctx.fillStyle = '#ffdd77';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius * b.life, 0, Math.PI*2);
            ctx.fill();
            const grad = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y, 18);
            grad.addColorStop(0, 'rgba(255, 220, 100, 0.15)');
            grad.addColorStop(1, 'rgba(255, 220, 100, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (const p of particles) {
            ctx.globalAlpha = p.life * 0.9;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff6633';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius * p.life, 0, Math.PI*2);
            ctx.fillStyle = p.color || '#cc5533';
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;

        for (const e of enemies) {
            const r = e.radius;
            const grad = ctx.createRadialGradient(e.x, e.y, 2, e.x, e.y, r*1.6);
            grad.addColorStop(0, `hsla(210, 70%, 70%, ${e.alpha*0.3})`);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(e.x, e.y, r*1.6, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 25;
            ctx.shadowColor = 'rgba(100,150,255,0.4)';
            ctx.fillStyle = `hsla(210, 70%, 70%, ${e.alpha*0.5})`;
            ctx.beginPath();
            ctx.arc(e.x, e.y, r, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = `hsla(210, 70%, 70%, ${e.alpha*0.35})`;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.moveTo(e.x - r*0.4, e.y - r*0.3);
            for (let t=0; t<=1; t+=0.05) {
                const waveX = e.x + Math.sin(t*8 + frame*0.04 + e.phase) * r*0.25;
                const waveY = e.y - r*0.3 - t*r*0.5;
                ctx.lineTo(waveX, waveY);
            }
            ctx.lineTo(e.x + r*0.4, e.y - r*0.3);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff3333';
            ctx.fillStyle = '#ff1a1a';
            ctx.beginPath();
            ctx.arc(e.x - r*0.3, e.y - r*0.1, r*0.16, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(e.x + r*0.3, e.y - r*0.1, r*0.16, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        for (let i=0; i<2; i++) {
            const p = pointers[i];
            const px = p.x, py = p.y;
            const color1 = i === 0 ? 'rgba(255,200,150,0.85)' : 'rgba(100,200,255,0.85)';
            const color2 = i === 0 ? 'rgba(255,100,80,0.9)' : 'rgba(80,180,255,0.9)';
            const shadowColor = i === 0 ? '#ff4400' : '#0088ff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = shadowColor;
            ctx.strokeStyle = color1;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(px, py, p.radius + 8, 0, Math.PI*2);
            ctx.stroke();
            ctx.shadowBlur = 15;
            ctx.strokeStyle = color2;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(px, py, p.radius + 2, 0, Math.PI*2);
            ctx.stroke();
            ctx.shadowBlur = 12;
            ctx.strokeStyle = color1;
            ctx.lineWidth = 2;
            const s = 16;
            ctx.beginPath();
            ctx.moveTo(px-s, py); ctx.lineTo(px+s, py);
            ctx.moveTo(px, py-s); ctx.lineTo(px, py+s);
            ctx.stroke();
            ctx.shadowBlur = 25;
            ctx.shadowColor = shadowColor;
            ctx.fillStyle = i === 0 ? '#ff3333' : '#33bbff';
            ctx.beginPath();
            ctx.arc(px, py, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        const activeCount = pointers.filter(p => p.active).length;
        ctx.fillStyle = 'rgba(255,200,100,0.2)';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`✌︎︎ ${activeCount} jari | ☣︎ ${bombCount}`, 450, 580);
        ctx.textAlign = 'left';

        if (gameOver) {
            ctx.fillStyle = 'rgba(8,0,0,0.78)';
            ctx.fillRect(0,0,W,H);
            ctx.font = 'bold 60px monospace';
            ctx.fillStyle = '#cc2222';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 70;
            ctx.textAlign = 'center';
            ctx.fillText('😹 MAMPOSS CUPU 😹', 450, 220);
            ctx.font = '28px monospace';
            ctx.fillStyle = '#ffd700';
            ctx.shadowBlur = 30;
            ctx.fillText(`♕ HIGHSCORE: ${highscore}`, 450, 290);
            ctx.font = '24px monospace';
            ctx.fillStyle = '#dd9988';
            ctx.shadowBlur = 20;
            ctx.fillText('klik "RESPAWN" kalo mau idup lagi, ea😏', 450, 350);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
        }

        ctx.restore();
    }

    // ---- LOOP ----
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // ---- EVENTS ----
    canvas.addEventListener('mousedown', (e) => {
        if (gameOver || !gameStarted) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width, scaleY = H/rect.height;
        let mx = (e.clientX - rect.left)*scaleX, my = (e.clientY - rect.top)*scaleY;
        mx = Math.min(W, Math.max(0, mx)); my = Math.min(H, Math.max(0, my));
        pointers[0].x = mx; pointers[0].y = my;
        pointers[0].active = true;
        shootTimers[0] = SHOOT_DELAY;
    });
    canvas.addEventListener('mouseup', () => { pointers[0].active = false; });
    canvas.addEventListener('mouseleave', () => { pointers[0].active = false; });
    canvas.addEventListener('mousemove', (e) => {
        if (gameOver || !gameStarted) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width, scaleY = H/rect.height;
        let mx = (e.clientX - rect.left)*scaleX, my = (e.clientY - rect.top)*scaleY;
        mx = Math.min(W, Math.max(0, mx)); my = Math.min(H, Math.max(0, my));
        pointers[0].x = mx; pointers[0].y = my;
    });

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameOver || !gameStarted) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width, scaleY = H/rect.height;
        for (let i=0; i<Math.min(e.touches.length, 2); i++) {
            const touch = e.touches[i];
            let mx = (touch.clientX - rect.left)*scaleX, my = (touch.clientY - rect.top)*scaleY;
            mx = Math.min(W, Math.max(0, mx)); my = Math.min(H, Math.max(0, my));
            pointers[i].x = mx; pointers[i].y = my;
            pointers[i].active = true;
            shootTimers[i] = SHOOT_DELAY;
        }
    });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (gameOver || !gameStarted) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W/rect.width, scaleY = H/rect.height;
        for (let i=0; i<Math.min(e.touches.length, 2); i++) {
            const touch = e.touches[i];
            let mx = (touch.clientX - rect.left)*scaleX, my = (touch.clientY - rect.top)*scaleY;
            mx = Math.min(W, Math.max(0, mx)); my = Math.min(H, Math.max(0, my));
            pointers[i].x = mx; pointers[i].y = my;
            pointers[i].active = true;
        }
        for (let i=e.touches.length; i<2; i++) pointers[i].active = false;
    }, { passive: false });
    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        for (let i=0; i<2; i++) pointers[i].active = false;
        for (let i=0; i<Math.min(e.touches.length, 2); i++) pointers[i].active = true;
    });
    canvas.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        for (let i=0; i<2; i++) pointers[i].active = false;
    });

    document.getElementById('restartBtn').addEventListener('click', () => {
        if (!gameStarted) return;
        restartGame();
    });
    bombBtn.addEventListener('click', triggerBomb);
    freezeBtn.addEventListener('click', triggerFreeze);

    // ---- START LOOP (dipanggil saat start) ----
    console.log('👻 NIGHT SHOOTER 👻 || Punya Jyo pokoknya');
    console.log(`♕ Highscore saat ini: ${highscore}`);
</script>
